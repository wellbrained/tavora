packages:
  - apps/*
  - packages/*
  - modules/*
  - examples/*

# pnpm 11 stopped reading the "pnpm" field of package.json: these settings live here.

# Install scripts: Electron and esbuild fetch their binaries. The others stay off, as they were with pnpm 10
# (koffi ships prebuilt binaries; electron-winstaller is only electron-builder's Squirrel path, which Tavora doesn't use).
allowBuilds:
  electron: true
  esbuild: true
  electron-winstaller: false
  koffi: false

overrides:
  dockview: 8.9.0
  dockview-core: 8.9.0
  nanoid@<3.3.18: 3.3.20
  nanoid@>=4.0.0 <5.1.16: 5.1.16
  lodash-es@<4.18.0: 4.18.1
  undici@>=7.0.0 <7.30.1: 7.30.2
  undici@>=6.0.0 <6.29.1: 6.29.1
  markdown-it@>=14.1.0 <14.3.3: 14.3.3
  vitepress>vite: 6.4.5
  ajv>fast-uri: 3.1.9
  mermaid>katex: 0.18.11
  app-builder-lib>minimatch: 11.0.3
  "@electron/universal>minimatch": 11.0.3

auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
    - GHSA-g3hv-75wg-m249

patchedDependencies:
  "@excalidraw/excalidraw@0.18.1": patches/@excalidraw__excalidraw@0.18.1.patch
