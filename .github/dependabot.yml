# Weekly pull requests for dependencies with a security fix or a new version: the pnpm workspace (one lockfile at the
# root) and the actions the workflows use. Minor and patch updates come grouped, so they arrive as one pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
