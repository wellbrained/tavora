name: Checks

# Typecheck, unit tests and build run for every pull request to main, for every
# push to main and for release tags, and next to them a Windows job installs and
# starts the packaged app (packaged-start, below). The e2e suite runs in shards
# on Windows (e2e, below) for release tags, for pull requests that change what it tests
# (e2e-scope) and when started by hand from the Actions tab (Run workflow, pick
# the branch). A new push to the same pull request cancels the run before it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the e2e suite
        type: boolean
        default: true

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm can call an install done while a patched dependency is still unpatched (scripts/check-patches.mjs).
      - run: pnpm check:patches
      # The module rules a script can see (docs/module-rules.md): fails on breaks that aren't in module-rules-baseline.json.
      - run: pnpm check:modules
      # Before anything is built, as in a fresh checkout: `pnpm dev` builds the host, the main process and every repo
      # module once and stops (dev.mjs --check). A broken dev start went unnoticed for a day after #494.
      - name: pnpm dev builds from a clean checkout
        run: pnpm dev --check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Known holes in what Tavora ships, and secrets in the history. The audit covers the whole workspace, dev tools
  # included, and fails on a high or critical advisory: most of what ends up in the app (electron, vue, the ad blocker,
  # dockview, @vueuse) is listed as a devDependency because it is bundled, so `--prod` would miss it. package.json's
  # pnpm.overrides lift the ones a compatible fix exists for, and pnpm.auditConfig.ignoreGhsas lists the rest with the
  # reason beside it: picomatch (GHSA-fc5q-39xc-vjpf), which Excalidraw's sass dependency pulls in for its file watcher; it is not in the
  # Whiteboard's built bundle; and minimatch (GHSA-g3hv-75wg-m249) under typedoc, which still calls an API that
  # minimatch 11 removed (typedoc 0.28.20 is the latest), so it stays on 10.x; it only runs in the docs build, on
  # our own file patterns. The same fix is applied to electron-builder's copies by override.
  # gitleaks scans the history of the checked-out commit only (not other branches); .gitleaks.toml allows the reviewed
  # test fixtures and public values by path or pattern, so a squash merge or another branch can't turn it red.
  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Dependency audit
        run: pnpm audit --audit-level high
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose --config .gitleaks.toml --log-opts="HEAD" .

  # Whether this run needs the e2e suite: always for release tags, by the checkbox when started by hand, and for a pull
  # request that changes the app, a module or the kit, the SDK, the packer, the manifest schema, the examples, the
  # dependencies or this file. Twice a broken e2e test only showed up while a release was running (0.23.0, 0.23.9).
  # Change notes alone don't count. If GitHub can't list the files, the suite runs.
  # It also says whether the signed-update check runs (update-check, below): the same way, for a pull request that
  # touches the update chain (UPDATE_PATHS).
  e2e-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
      update: ${{ steps.scope.outputs.update }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR: ${{ github.event.pull_request.number }}
          BY_HAND: ${{ inputs.e2e }}
          PATHS: ^(apps/desktop/|modules/|examples/|packages/(sdk|pack|module-schema)/|patches/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/ci\.yml$)
          UPDATE_PATHS: ^(apps/desktop/src/main/(updates|update-[a-z-]+)\.ts$|apps/desktop/scripts/(update-[a-z-]+|serve-feed|start-check|windows|release|after-pack)\.(mjs|cjs|ps1)$|apps/desktop/package\.json$|patches/|pnpm-lock\.yaml$|\.github/workflows/(ci|release-build)\.yml$)
        run: |
          if [[ "$REF" == refs/tags/* ]]; then run=true; update=true
          elif [[ "$EVENT" == workflow_dispatch ]]; then run=$BY_HAND; update=$BY_HAND
          elif [[ "$EVENT" == pull_request ]]; then
            if files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename'); then
              if grep -v '^apps/desktop/changes/' <<<"$files" | grep -qE "$PATHS"; then run=true; else run=false; fi
              if grep -qE "$UPDATE_PATHS" <<<"$files"; then update=true; else update=false; fi
            else
              run=true; update=true
            fi
          else run=false; update=false
          fi
          echo "e2e: $run, update-check: $update"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "update=$update" >> "$GITHUB_OUTPUT"

  # Windows, like the users and `pnpm release`: on Ubuntu the suite needed well over an hour and 17 tests failed only
  # there. Split over 8 runners side by side, each shard takes about 5 minutes with its own install (from the pnpm
  # cache) and build, rather than waiting on the check job.
  e2e:
    needs: e2e-scope
    if: needs.e2e-scope.outputs.run == 'true'
    name: e2e (${{ matrix.shard }}/8)
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # A small screen squeezes docked panels into tabs.
      - name: Screen 1920x1080
        shell: pwsh
        continue-on-error: true
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-CimInstance Win32_VideoController | Select-Object CurrentHorizontalResolution, CurrentVerticalResolution
      - run: pnpm --filter @tavora/desktop test:e2e --shard=${{ matrix.shard }}/8
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.shard }}
          path: apps/desktop/test-results
          retention-days: 7

  # Signed app updates end to end (CoreHub #476): a bug in the signature check would leave every installed Tavora on
  # its version for good. update-check.mjs pins throwaway keys, packages this version and the next for a local feed,
  # installs the first like a user and checks that unsigned, foreign-key, changed and relabelled updates are refused
  # while one signed by the release or the backup key is taken and installs on quit. The Release build runs it for
  # every release; here for release tags, by hand and for pull requests that touch the update chain (e2e-scope).
  update-check:
    needs: e2e-scope
    if: needs.e2e-scope.outputs.update == 'true'
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pin throwaway update keys
        run: node apps/desktop/scripts/update-check.mjs prepare "${{ runner.temp }}\update-check"
      - run: pnpm build
      - name: Signed updates end to end
        run: node apps/desktop/scripts/update-check.mjs run "${{ runner.temp }}\update-check"

  # Development and CI use Node 24, but the API service runs on Node 22 on the server, and the
  # npm packages for module developers (@tavora/pack, @tavora/create-module) promise Node 22.12+.
  # So the unit tests run on Node 22 as well.
  node-22:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # e2e runs Tavora unpackaged, so code that only runs packaged was never started before a
  # release (0.17.3 quit on every start). This builds the real installer, installs it the way
  # a user does and passes only once the installed Tavora shows its window. `pnpm release`
  # requires the whole Checks run, so this job too.
  packaged-start:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Media connector's helper is Rust (packages/media-helper); the runner has Rust, and pnpm build builds it.
      - name: Test the media helper
        working-directory: packages/media-helper
        run: cargo test --release --locked
      - run: pnpm build
      - name: The media helper is in the package
        shell: pwsh
        run: |
          pnpm --filter @tavora/desktop package --win nsis --publish never
          if (-not (Test-Path apps/desktop/release/win-unpacked/resources/media-helper/tavora-media.exe)) { throw "tavora-media.exe is missing from the package." }
          # The third-party notices (apps/desktop/scripts/licences.mjs; the build already failed for a package without an allowed
          # licence): the readable file next to the resources, with a few known packages in it, and the list Settings > Licences
          # reads inside app.asar.
          $notices = "apps/desktop/release/win-unpacked/resources/THIRD_PARTY_NOTICES.txt"
          if (-not (Test-Path $notices)) { throw "THIRD_PARTY_NOTICES.txt is missing from the package." }
          $text = Get-Content $notices -Raw
          foreach ($known in "electron-updater", "koffi", "vue ", "Inter Project Authors", "serde ") { if (-not $text.Contains($known)) { throw "$known is missing from THIRD_PARTY_NOTICES.txt." } }
          if (-not ((pnpm --filter @tavora/desktop exec asar list "$PWD/apps/desktop/release/win-unpacked/resources/app.asar") -match 'licences\.json')) { throw "out/licences/licences.json is missing from app.asar." }
          # Outside app.asar: the system-info worker and koffi with its native part run from app.asar.unpacked.
          $unpacked = "apps/desktop/release/win-unpacked/resources/app.asar.unpacked"
          foreach ($file in "out/main/system-info-worker.cjs", "node_modules/koffi/package.json", "node_modules/@koromix/koffi-win32-x64/win32_x64/koffi.node") {
            if (-not (Test-Path "$unpacked/$file")) { throw "$file is missing from app.asar.unpacked." }
          }
      - name: Install like a user (silent, per-user)
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/release -Filter 'Tavora-Setup-*.exe' | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The installer exited with $($p.ExitCode)." }
      # The fuses of the exe users get: no running as plain Node, cookies encrypted, the app only from an app.asar
      # that matches its hash (scripts/check-fuses.mjs).
      - name: The installed Tavora's fuses are safe
        shell: pwsh
        run: node apps/desktop/scripts/check-fuses.mjs "$env:LOCALAPPDATA\Programs\Tavora\Tavora.exe"
      - name: The installed Tavora has its notices
        shell: pwsh
        run: |
          $file = "$env:LOCALAPPDATA\Programs\Tavora\resources\THIRD_PARTY_NOTICES.txt"
          if (-not (Test-Path $file) -or (Get-Item $file).Length -lt 100000) { throw "THIRD_PARTY_NOTICES.txt is missing or empty in the installed Tavora." }
      - name: Start the installed Tavora
        shell: pwsh
        env:
          START_CHECK_SCREENSHOT: ${{ runner.temp }}\start-check.png
        run: node apps/desktop/scripts/start-check.mjs "$env:LOCALAPPDATA\Programs\Tavora\Tavora.exe"
      - if: failure()
        name: Startup log
        shell: pwsh
        run: Get-Content "$env:APPDATA\@tavora\desktop\logs\startup.log" -ErrorAction SilentlyContinue
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: start-check-screen
          path: ${{ runner.temp }}\start-check.png
          if-no-files-found: ignore
          retention-days: 7
