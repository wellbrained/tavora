name: Release checks

# Tests run locally during development (pnpm check). This workflow only runs
# for release tags, or when started by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox
      # uses. Re-enable them rather than running Electron with --no-sandbox, so
      # the e2e gate tests run with the real OS sandbox.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: apps/desktop/test-results
          retention-days: 7
