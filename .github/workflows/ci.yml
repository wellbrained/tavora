name: Checks

# Typecheck, unit tests and build run for every pull request to main, for every
# push to main and for release tags, and next to them a Windows job installs and
# starts the packaged app (packaged-start, below). The e2e suite runs in shards
# (e2e, below) for release tags, for pull requests that change what it tests
# (e2e-scope) and when started by hand from the Actions tab (Run workflow, pick
# the branch). A new push to the same pull request cancels the run before it.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      e2e:
        description: Run the e2e suite
        type: boolean
        default: true

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Before anything is built, as in a fresh checkout: `pnpm dev` builds the host, the main process and every repo
      # module once and stops (dev.mjs --check). A broken dev start went unnoticed for a day after #494.
      - name: pnpm dev builds from a clean checkout
        run: pnpm dev --check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Whether this run needs the e2e suite: always for release tags, by the checkbox when started by hand, and for a pull
  # request that changes the app, a module or the kit, the SDK, the packer, the manifest schema, the examples, the
  # dependencies or this file. Twice a broken e2e test only showed up while a release was running (0.23.0, 0.23.9).
  # Change notes alone don't count. If GitHub can't list the files, the suite runs.
  e2e-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR: ${{ github.event.pull_request.number }}
          BY_HAND: ${{ inputs.e2e }}
          PATHS: ^(apps/desktop/|modules/|examples/|packages/(sdk|pack|module-schema)/|patches/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/ci\.yml$)
        run: |
          if [[ "$REF" == refs/tags/* ]]; then run=true
          elif [[ "$EVENT" == workflow_dispatch ]]; then run=$BY_HAND
          elif [[ "$EVENT" == pull_request ]]; then
            if files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename'); then
              if grep -v '^apps/desktop/changes/' <<<"$files" | grep -qE "$PATHS"; then run=true; else run=false; fi
            else
              run=true
            fi
          else run=false
          fi
          echo "e2e: $run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # The suite takes about 14 minutes on a fast PC but well over an hour on one runner, so it is split over 8 runners
  # that run side by side. Each builds for itself (about 20 s) rather than waiting on the check job.
  e2e:
    needs: e2e-scope
    if: needs.e2e-scope.outputs.run == 'true'
    name: e2e (${{ matrix.shard }}/8)
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # A small screen squeezes docked panels into tabs.
      - name: Screen 1920x1080
        shell: pwsh
        continue-on-error: true
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-CimInstance Win32_VideoController | Select-Object CurrentHorizontalResolution, CurrentVerticalResolution
      - run: pnpm --filter @tavora/desktop test:e2e --shard=${{ matrix.shard }}/8
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.shard }}
          path: apps/desktop/test-results
          retention-days: 7

  # Development and CI use Node 24, but the API service runs on Node 22 on the server, and the
  # npm packages for module developers (@tavora/pack, @tavora/create-module) promise Node 22.12+.
  # So the unit tests run on Node 22 as well.
  node-22:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # e2e runs Tavora unpackaged, so code that only runs packaged was never started before a
  # release (0.17.3 quit on every start). This builds the real installer, installs it the way
  # a user does and passes only once the installed Tavora shows its window. `pnpm release`
  # requires the whole Checks run, so this job too.
  packaged-start:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Media connector's helper is Rust (packages/media-helper); the runner has Rust, and pnpm build builds it.
      - name: Test the media helper
        working-directory: packages/media-helper
        run: cargo test --release --locked
      - run: pnpm build
      - name: The media helper is in the package
        shell: pwsh
        run: |
          pnpm --filter @tavora/desktop package --win nsis --publish never
          if (-not (Test-Path apps/desktop/release/win-unpacked/resources/media-helper/tavora-media.exe)) { throw "tavora-media.exe is missing from the package." }
      - name: Install like a user (silent, per-user)
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/release -Filter 'Tavora-Setup-*.exe' | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The installer exited with $($p.ExitCode)." }
      - name: Start the installed Tavora
        shell: pwsh
        env:
          START_CHECK_SCREENSHOT: ${{ runner.temp }}\start-check.png
        run: node apps/desktop/scripts/start-check.mjs "$env:LOCALAPPDATA\Programs\Tavora\Tavora.exe"
      - if: failure()
        name: Startup log
        shell: pwsh
        run: Get-Content "$env:APPDATA\@tavora\desktop\logs\startup.log" -ErrorAction SilentlyContinue
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: start-check-screen
          path: ${{ runner.temp }}\start-check.png
          if-no-files-found: ignore
          retention-days: 7
