name: Release SDK packages

# Publishes the module developer packages to npm (@tavora/sdk, @tavora/module-schema, @tavora/pack,
# @tavora/create-module) with the same checks as `pnpm release:sdk`: only versions npm doesn't have yet, from main,
# after typecheck and tests, each with its changelog entry. Started by hand only (Actions tab, or Tavora Admin's
# Publish button, which opens this page), and the publish job waits in the `npm` environment until the maintainer
# approves it there (decided 2026-11-01). npm trusts this workflow directly (trusted publishing): there is no npm
# token anywhere, and every package gets provenance that points back to this run.
#
# Two jobs, so the right to publish never sits next to code from dependencies: `pack` installs, checks, tests and
# packs without it; `publish` gets the one-time OIDC token, never checks out or installs anything, and only hands
# the packed files to npm. Actions are pinned by commit, as in release-build.yml.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (npm only shows what it would publish)
        type: boolean
        default: false

concurrency:
  group: release-sdk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pack:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:patches
      # As in Checks: the typecheck the script runs needs what a first `pnpm dev` builds.
      - run: pnpm dev --check
      - name: Check, test and pack what npm doesn't have yet
        run: node scripts/release-sdk.mjs --pack-to "$RUNNER_TEMP/npm"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      # The short-lived OIDC token npm exchanges for a one-time publish right (trusted publishing).
      id-token: write
    steps:
      # No registry-url: that would write an .npmrc expecting a token, and trusted publishing needs none.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-packages
          path: npm
      # In the order the pack job numbered them (1-, 2-, ...), each package after the ones it depends on.
      - name: Publish
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          for file in $(ls npm/*.tgz | sort -V); do
            if [ "$DRY_RUN" = "true" ]; then npm publish "$file" --access public --dry-run; else npm publish "$file" --access public; fi
          done
