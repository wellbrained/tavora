name: Version

# A pull request leaves the app version alone and brings a change note in
# apps/desktop/changes/ instead; main gives out the number when it merges (number.yml).
# A note that raises the minor or major number needs the `feature-complete` label,
# which only the maintainer adds (the decision log, 2026-10-16). Runs again when labels change.
# It looks only at what this pull request changed since it left main, so a main that moved on or notes
# waiting to be numbered there never fail it.
on:
  pull_request:
    branches: [main]
    # edited: a pull request retargeted to main (after the one it was stacked on merged) is checked too.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the version and change notes
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'feature-complete') }}
        run: node apps/desktop/scripts/change-notes.mjs check origin/main "$LABELED" "$HEAD_SHA"
      # A built-in module whose files (or the kit it bundles) changed raises its version (CLAUDE.md, "Built-in modules").
      - name: Check the built-in modules' versions
        # Also when the change notes failed, so one run shows both problems.
        if: ${{ !cancelled() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-module-versions.mjs origin/main "$HEAD_SHA"
