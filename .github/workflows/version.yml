name: Version

# A pull request leaves the app version alone and brings a change note in
# apps/desktop/changes/ instead; main gives out the number when it merges (number.yml).
# A note that raises the minor or major number needs the `feature-complete` label,
# which only the maintainer adds (the decision log, 2026-10-16). Runs again when labels change.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the version and change notes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'feature-complete') }}
        run: node apps/desktop/scripts/change-notes.mjs check "$BASE_SHA" "$LABELED"
