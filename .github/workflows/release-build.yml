name: Release build

# Started by `pnpm release` on the maintainer's PC (gh workflow run), on main only. It tests and builds the
# Windows installer with no secrets at all and attests what it built (build provenance, signed by GitHub for
# this workflow, this repo and this commit). The PC then downloads the files, checks them against these
# attestations and the SHA-256 this run printed, and uploads them with its own restricted key. Nothing here
# can publish: there is no key, token or upload step (decided 2026-10-30/31, CoreHub #421).
# Every action is pinned to a commit: the attestation is what the PC trusts, so a moved tag must not change
# what gets built and attested here.
run-name: Release build ${{ inputs.version }} e2e=${{ inputs.e2e }} (${{ inputs.nonce }})
on:
  workflow_dispatch:
    inputs:
      version:
        description: The app version to build (must match apps/desktop/package.json)
        required: true
        type: string
      e2e:
        description: Run the e2e suite (off only for a retry after it passed)
        type: boolean
        default: true
      nonce:
        description: Set by pnpm release, so it finds the run it started (shown in the run's name)
        required: true
        type: string

concurrency:
  group: release-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: The version to build is this commit's
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a version: $VERSION"; exit 1; }
          actual="$(node -p 'require("./apps/desktop/package.json").version')"
          [[ "$actual" == "$VERSION" ]] || { echo "apps/desktop/package.json says $actual, not $VERSION"; exit 1; }
      # A fresh install on every run, and a check that every patched dependency really is patched.
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:patches
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The e2e suite on Windows in 8 shards side by side, as in the Checks workflow (ci.yml). On one Ubuntu runner it
  # ran out of time (run 41203162350 reached test 50 of ~183 in 28 minutes), and some tests fail only there.
  # Each shard installs and builds on its own and takes about 5 minutes.
  e2e:
    if: github.ref == 'refs/heads/main' && inputs.e2e
    name: e2e (${{ matrix.shard }}/8)
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:patches
      - run: pnpm build
      # A small screen squeezes docked panels into tabs.
      - name: Screen 1920x1080
        shell: pwsh
        continue-on-error: true
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Get-CimInstance Win32_VideoController | Select-Object CurrentHorizontalResolution, CurrentVerticalResolution
      - run: pnpm --filter @tavora/desktop test:e2e --shard=${{ matrix.shard }}/8
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.shard }}
          path: apps/desktop/test-results
          retention-days: 7

  # Only after the tests and every e2e shard passed. e2e may be skipped only when the run was started without it.
  package:
    needs: [test, e2e]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && needs.test.result == 'success' &&
      (needs.e2e.result == 'success' || (!inputs.e2e && needs.e2e.result == 'skipped'))
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:patches
      - name: Test the media helper
        working-directory: packages/media-helper
        run: cargo test --release --locked
      - run: pnpm build
      - name: Package
        shell: pwsh
        run: |
          pnpm --filter @tavora/desktop package --win --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed.' }
          if (-not (Test-Path apps/desktop/release/win-unpacked/resources/media-helper/tavora-media.exe)) { throw 'tavora-media.exe is missing from the package.' }
          foreach ($name in "Tavora-Setup-$env:VERSION.exe", "Tavora-Setup-$env:VERSION.exe.blockmap", 'latest.yml', "Tavora-$env:VERSION-win.zip") {
            if (-not (Test-Path "apps/desktop/release/$name")) { throw "The build did not produce $name." }
          }
          if (-not (Select-String -Path apps/desktop/release/latest.yml -Pattern "^version: $([regex]::Escape($env:VERSION))$" -Quiet)) { throw "latest.yml does not say version $env:VERSION." }
      - name: Install like a user (silent, per-user)
        shell: pwsh
        run: |
          $p = Start-Process "apps/desktop/release/Tavora-Setup-$env:VERSION.exe" -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The installer exited with $($p.ExitCode)." }
      - name: Start the installed Tavora
        shell: pwsh
        env:
          START_CHECK_SCREENSHOT: ${{ runner.temp }}\start-check.png
        run: node apps/desktop/scripts/start-check.mjs "$env:LOCALAPPDATA\Programs\Tavora\Tavora.exe"
      - if: failure()
        name: Startup log
        shell: pwsh
        run: Get-Content "$env:APPDATA\@tavora\desktop\logs\startup.log" -ErrorAction SilentlyContinue
      # The PC compares these lines (from this run's log) with the files it downloads.
      - name: SHA-256 of the release files
        shell: pwsh
        run: |
          "### Tavora $env:VERSION" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          foreach ($name in "Tavora-Setup-$env:VERSION.exe", "Tavora-Setup-$env:VERSION.exe.blockmap", 'latest.yml', "Tavora-$env:VERSION-win.zip") {
            $line = "RELEASE-SHA256 $((Get-FileHash -Algorithm SHA256 "apps/desktop/release/$name").Hash.ToLower())  $name"
            Write-Output $line
            $line | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }
          '```' | Out-File $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            apps/desktop/release/Tavora-Setup-${{ inputs.version }}.exe
            apps/desktop/release/Tavora-Setup-${{ inputs.version }}.exe.blockmap
            apps/desktop/release/latest.yml
            apps/desktop/release/Tavora-${{ inputs.version }}-win.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tavora-release-${{ inputs.version }}
          path: |
            apps/desktop/release/Tavora-Setup-${{ inputs.version }}.exe
            apps/desktop/release/Tavora-Setup-${{ inputs.version }}.exe.blockmap
            apps/desktop/release/latest.yml
            apps/desktop/release/Tavora-${{ inputs.version }}-win.zip
          if-no-files-found: error
          retention-days: 7
