[package]
name = "tavora-media"
version = "0.1.0"
edition = "2021"
publish = false
description = "Tavora's media helper: reads Windows' media sessions and passes play/pause, next and previous on."

[[bin]]
name = "tavora-media"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_System_WinRT",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
