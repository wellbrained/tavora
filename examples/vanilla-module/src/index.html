<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vanilla Test Module</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main>
      <h1>Vanilla Test Module</h1>
      <p data-testid="status">Connecting…</p>
      <dl>
        <dt>Workspace</dt>
        <dd data-testid="workspace">–</dd>
        <dt>Viewport</dt>
        <dd data-testid="viewport">–</dd>
        <dt>Theme</dt>
        <dd data-testid="theme">–</dd>
        <dt>Panel</dt>
        <dd data-testid="lifecycle">–</dd>
      </dl>

      <section>
        <h2>Clicks saved in this workspace</h2>
        <p data-testid="count">–</p>
        <button type="button" class="primary" data-testid="increment" disabled>Add a click</button>
      </section>

      <section>
        <h2>Shared note <small>revision <span data-testid="note-revision">–</span></small></h2>
        <textarea data-testid="note" rows="3" disabled></textarea>
        <p><button type="button" data-testid="save-note" disabled>Save note</button> <span data-testid="note-status"></span></p>
      </section>

      <section>
        <h2>This panel's view: <span data-testid="view">–</span></h2>
        <button type="button" data-testid="view-list" disabled>List</button>
        <button type="button" data-testid="view-grid" disabled>Grid</button>
      </section>

      <section>
        <h2>Fills the workspace: <span data-testid="maximized">–</span></h2>
        <button type="button" data-testid="toggle-maximized" disabled>Maximize</button>
      </section>
    </main>
  </body>
</html>
