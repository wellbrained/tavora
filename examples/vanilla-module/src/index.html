<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vanilla Test Module</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main>
      <h1>Vanilla Test Module</h1>
      <p data-testid="status">Connecting…</p>
      <dl>
        <dt>Game</dt>
        <dd data-testid="game">–</dd>
        <dt>Viewport</dt>
        <dd data-testid="viewport">–</dd>
        <dt>Theme</dt>
        <dd data-testid="theme">–</dd>
        <dt>Clicks saved for this game</dt>
        <dd data-testid="count">–</dd>
      </dl>
      <button type="button" data-testid="increment" disabled>Add a click</button>
    </main>
  </body>
</html>
