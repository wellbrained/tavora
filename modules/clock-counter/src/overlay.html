<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Clock & Counter overlay</title>
    <script type="module" src="./overlay.ts"></script>
  </head>
  <body>
    <main id="overlay" hidden>
      <!-- The name and the value stand on one baseline, in one font. -->
      <div class="line">
        <span class="label"></span>
        <span class="value"></span>
      </div>
      <div class="lap"></div>
    </main>
    <!-- The live view of a panel shown over the game: all the panel's clocks and counters, one row each. -->
    <ul id="live" hidden></ul>
  </body>
</html>
