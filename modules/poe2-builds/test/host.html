<!doctype html><meta charset="utf-8"><title>PoE 2 alpha · SDK bridge smoke test</title><style>body{margin:0;background:#171412;color:#eee;font:13px Segoe UI}header{height:36px;padding:7px;box-sizing:border-box}.panels{min-height:1050px;height:calc(100vh - 36px);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:5px}iframe{width:100%;height:100%;border:1px solid #655237;box-sizing:border-box}</style><header>SDK bridge test host · Tree / Skills / Gear / Guide · Development only</header><div class="panels"><iframe title="Tree panel" src="/panel?type=tree"></iframe><iframe title="Skills panel" src="/panel?type=skills"></iframe><iframe title="Gear panel" src="/panel?type=gear"></iframe><iframe title="Guide panel" src="/panel?type=guide"></iframe></div><script>
const state=JSON.parse(localStorage.getItem('poe2-alpha-test')||'{"docs":{},"views":{},"storage":{}}');const ports=new Map();let next=0;
function save(){localStorage.setItem('poe2-alpha-test',JSON.stringify(state))}
window.attach=(type,port)=>{const identity=++next;ports.set(identity,{type,port});port.onmessage=async({data:request})=>{const {id,method,params:p={}}=request;try{let result=null;switch(method){case 'bridge.handshake':result={protocol:1,host:{name:'tavora-desktop',version:'0.17.20'},module:{id:'local.poe2-builds',version:'0.1.0-alpha.1'},capabilities:[],panel:{type}};break;case 'ui.getTheme':result={mode:'dark',colors:{background:'#171412',surface:'#201c19',text:'#eee7d9',textMuted:'#aaa398',accent:'#e0a243'},tokens:{},radius:5};break;case 'documents.list':result=Object.values(state.docs).map(({data,...summary})=>summary);break;case 'documents.get':result=state.docs[p.id]||null;break;case 'documents.put':{const key=p.id,old=state.docs[key];if(p.ifRevision!==undefined&&p.ifRevision!==(old?.revision||0))throw Error('CONFLICT');result={id:key,title:p.title,revision:(old?.revision||0)+1,updatedAt:new Date().toISOString(),bytes:JSON.stringify(p.data).length};state.docs[key]={...result,data:p.data};save();for(const [other,{port}]of ports)if(other!==identity)port.postMessage({v:1,event:'documents.changed',data:{id:key,revision:result.revision}});break}case 'documents.delete':delete state.docs[p.id];save();break;case 'storage.get':result=state.storage[p.key]??null;break;case 'storage.set':state.storage[p.key]=p.value;save();break;case 'panel.getState':result=state.views[type]?.state||null;break;case 'panel.setState':state.views[type]||={};state.views[type].state=p.value;save();break;case 'panel.getLaunch':result=state.views[type]?.state?{reason:'restore',content:state.views[type].content||null}:{reason:'add'};break;case 'panel.setContent':state.views[type]||={};state.views[type].content=p.content;save();break;case 'panels.open':{const target=[...ports.values()].find(entry=>entry.type===p.type);if(!target)throw Error('No panel');target.port.postMessage({v:1,event:'panel.navigate',data:{requestId:++next,content:p.content}});result='switched';break}case 'panel.navigated':break;case 'links.open':break;default:throw Error('Unsupported test method: '+method)}port.postMessage({v:1,id,ok:true,result})}catch(error){port.postMessage({v:1,id,ok:false,error:{code:'BAD_REQUEST',message:String(error)}})}};port.start()};
</script>
